<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- Premium background gradient imitating the Dattasoft branding colors -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Secondary glowing blobs for high premium aesthetics -->
    <radialGradient id="glowTeal" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Professional card shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#glowTeal)" />
  <rect width="1280" height="720" fill="url(#glowBlue)" />

  <!-- Clean Grid Lines representing abstract technology branding -->
  <path d="M0,80 L1280,80 M0,160 L1280,160 M0,240 L1280,240 M0,320 L1280,320 M0,400 L1280,400 M0,480 L1280,480 M0,560 L1280,560 M0,640 L1280,640" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
  <path d="M160,0 L160,720 M320,0 L320,720 M480,0 L480,720 M640,0 L640,720 M800,0 L800,720 M960,0 L960,720 M1120,0 L1120,720" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />

  <!-- CENTERED PROCESSING CARD -->
  <!-- Card Base -->
  <rect x="370" y="110" width="540" height="500" rx="36" fill="#ffffff" filter="url(#cardShadow)" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1" />

  <!-- Logo Section (Centered) -->
  <g transform="translate(640, 140)">
    <!-- Stylized brand logo mark (Dattasoft D icon) -->
    <rect x="-100" y="5" width="40" height="40" rx="10" fill="#2563eb" />
    <path d="M-85,15 L-85,35 L-78,35 C-72,35 -68,31 -68,25 C-68,19 -72,15 -78,15 Z" fill="#ffffff" />
    <path d="M-81,20 L-81,30 L-77,30 C-74,30 -72,28 -72,25 C-72,22 -74,20 -77,20 Z" fill="#2563eb" />
    <!-- Brand Typography -->
    <text x="-50" y="28" font-family="sans-serif" font-weight="900" font-size="22" fill="#0f172a" letter-spacing="1">DATTA <tspan fill="#2563eb" font-weight="500">ERP</tspan></text>
    <text x="-50" y="42" font-family="sans-serif" font-weight="700" font-size="8" fill="#94a3b8" letter-spacing="2">SOCIOS DE TU CRECIMIENTO</text>
  </g>

  <!-- Content Group -->
  <g transform="translate(640, 220)">
    <!-- Spinner with Rocket -->
    <g transform="translate(0, 70)">
      <!-- Outer Track -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="#f1f5f9" stroke-width="6" />
      <!-- Animated Progress Arc -->
      <path d="M 0 -56 A 56 56 0 0 1 56 0" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
      
      <!-- Bouncing Rocket Icon -->
      <g transform="translate(0, 0)">
        <!-- Beautiful vector rocket icon instead of emoji for ultra-premium design -->
        <path d="M-10,12 C-10,12 -12,4 -10,-8 C-8,-20 0,-25 0,-25 C0,-25 8,-20 10,-8 C12,4 10,12 10,12 Z" fill="#3b82f6" />
        <path d="M-10,12 C-10,12 -12,4 -10,-8 C-8,-20 0,-25 0,-25 Z" fill="#2563eb" />
        <!-- Fins -->
        <path d="M-10,4 L-16,14 L-10,12 Z" fill="#1d4ed8" />
        <path d="M10,4 L16,14 L10,12 Z" fill="#1d4ed8" />
        <!-- Thruster Fire -->
        <path d="M-4,12 L0,22 L4,12 Z" fill="#ef4444" />
        <path d="M-2,12 L0,17 L2,12 Z" fill="#f59e0b" />
        <!-- Window -->
        <circle cx="0" cy="-6" r="3.5" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="1.5" />
      </g>
    </g>

    <!-- Headers -->
    <text x="0" y="175" font-family="sans-serif" font-weight="bold" font-size="22" fill="#0f172a" text-anchor="middle">Creando tu cuenta</text>
    <text x="0" y="198" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Esto solo tomará un momento. Estamos preparando tu cuenta</text>
    <text x="0" y="215" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">y configurando tu infraestructura en la nube.</text>

    <!-- Horizontal sleek status bar -->
    <g transform="translate(-100, 240)">
      <rect x="0" y="0" width="200" height="6" rx="3" fill="#f1f5f9" />
      <!-- Simulated 75% loading -->
      <rect x="0" y="0" width="150" height="6" rx="3" fill="#2563eb" />
    </g>
    
    <!-- Checklist / Sub-status -->
    <text x="0" y="275" font-family="sans-serif" font-weight="bold" font-size="11" fill="#10b981" letter-spacing="1.5" text-anchor="middle">⚙️ APROVISIONANDO RECURSOS CLOUD</text>
  </g>
</svg>
