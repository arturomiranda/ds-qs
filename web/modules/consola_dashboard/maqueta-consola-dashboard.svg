<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- Soft shadow filters for modern card look -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. BACKGROUND -->
  <rect width="1280" height="720" fill="#f8fafc" />

  <!-- 2. SIDEBAR LATERAL (Ancho: 260px) -->
  <rect x="0" y="0" width="260" height="720" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Logo Section in Sidebar -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#2563eb" />
    <path d="M10,8 L10,26 L16,26 C21,26 24,23 24,17 C24,11 21,8 16,8 Z" fill="#ffffff" />
    <path d="M13,12 L13,22 L16,22 C19,22 20.5,20.5 20.5,17 C20.5,13.5 19,12 16,12 Z" fill="#2563eb" />
    <text x="44" y="24" font-family="sans-serif" font-weight="900" font-size="18" fill="#0f172a" letter-spacing="1">DATTA <tspan fill="#2563eb" font-weight="500">ERP</tspan></text>
  </g>

  <!-- Sidebar Menu Items -->
  <g transform="translate(20, 95)" font-family="sans-serif" font-size="13" font-weight="bold">
    <!-- Item 1: Active Dashboard Option -->
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#eff6ff" />
    <text x="45" y="26" fill="#2563eb">Dashboard / Consola</text>
    <rect x="15" y="14" width="14" height="14" rx="3" fill="none" stroke="#2563eb" stroke-width="2" />
    <line x1="22" y1="14" x2="22" y2="28" stroke="#2563eb" stroke-width="1.5" />

    <!-- Item 2: Instancias -->
    <g transform="translate(0, 52)" opacity="0.6">
      <text x="45" y="26" fill="#64748b">Instancias SaaS</text>
      <!-- Database Icon -->
      <path d="M15,14 C15,10 27,10 27,14 M15,14 L15,24 C15,28 27,28 27,24 L27,14 M15,19 C15,23 27,23 27,19" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Item 3: Usuarios -->
    <g transform="translate(0, 104)" opacity="0.6">
      <text x="45" y="26" fill="#64748b">Usuarios y Accesos</text>
      <!-- Users Icon -->
      <circle cx="21" cy="18" r="3.5" fill="none" stroke="#64748b" stroke-width="2" />
      <path d="M15,27 C15,23 27,23 27,27" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Item 4: Grupos -->
    <g transform="translate(0, 156)" opacity="0.6">
      <text x="45" y="26" fill="#64748b">Grupos de Trabajo</text>
      <!-- Folders Icon -->
      <path d="M15,16 L19,16 L21,19 L27,19 L27,26 L15,26 Z" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Item 5: Calendario -->
    <g transform="translate(0, 208)" opacity="0.6">
      <text x="45" y="26" fill="#64748b">Calendario Operativo</text>
      <!-- Calendar Icon -->
      <rect x="15" y="14" width="14" height="14" rx="2.5" fill="none" stroke="#64748b" stroke-width="2" />
      <line x1="15" y1="19" x2="29" y2="19" stroke="#64748b" stroke-width="2" />
    </g>

    <!-- Item 6: Configuración -->
    <g transform="translate(0, 420)" opacity="0.6">
      <text x="45" y="26" fill="#64748b">Configuración</text>
      <!-- Gear Icon -->
      <circle cx="22" cy="20" r="4" fill="none" stroke="#64748b" stroke-width="2" />
    </g>
  </g>

  <!-- 3. NAVBAR SUPERIOR (Ancho restante: 1020px) -->
  <rect x="260" y="0" width="1020" height="80" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Search input -->
  <g transform="translate(295, 20)">
    <rect width="280" height="40" rx="10" fill="#f1f5f9" />
    <text x="40" y="24" font-family="sans-serif" font-size="13" fill="#94a3b8">Buscar instancia, subdominio...</text>
    <circle cx="22" cy="20" r="4.5" fill="none" stroke="#94a3b8" stroke-width="2" />
    <line x1="25.5" y1="23.5" x2="30" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Notification & Profile Avatar -->
  <g transform="translate(1080, 20)">
    <!-- Notification Bell -->
    <circle cx="20" cy="20" r="20" fill="#f8fafc" />
    <path d="M16,24 A4,4 0 0,0 24,24" fill="none" stroke="#64748b" stroke-width="2" />
    <path d="M13,22 L27,22 L25,18 L25,14 C25,11.5 22.5,9 20,9 C17.5,9 15,11.5 15,14 L15,18 Z" fill="#64748b" />
    <circle cx="26" cy="12" r="4" fill="#ef4444" />

    <!-- Avatar User -->
    <g transform="translate(50, 0)">
      <circle cx="20" cy="20" r="20" fill="#2563eb" />
      <text x="20" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">W</text>
      <text x="50" y="18" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0f172a">William</text>
      <text x="50" y="32" font-family="sans-serif" font-size="10" fill="#64748b">Dueño de Cuenta</text>
    </g>
  </g>

  <!-- 4. CONTENIDO PRINCIPAL -->
  <g transform="translate(290, 110)">
    <!-- Welcome Header -->
    <text x="5" y="10" font-family="sans-serif" font-weight="900" font-size="24" fill="#0f172a">Consola de Control Multi-tenant</text>
    <text x="5" y="30" font-family="sans-serif" font-size="13" fill="#64748b">Gestiona y aprovisiona tus instancias aisladas y monitorea sus bases de datos dedicadas.</text>

    <!-- METRICS CARD ROW -->
    <!-- Card 1: Instancias SaaS -->
    <g transform="translate(5, 50)" filter="url(#softShadow)">
      <rect width="295" height="90" rx="16" fill="#ffffff" />
      <rect width="5" height="90" rx="2.5" fill="#2563eb" />
      <text x="20" y="32" font-family="sans-serif" font-weight="bold" font-size="11" fill="#94a3b8" letter-spacing="1">INSTANCIAS SAAS</text>
      <text x="20" y="68" font-family="sans-serif" font-weight="900" font-size="32" fill="#0f172a">3</text>
      <text x="60" y="65" font-family="sans-serif" font-weight="bold" font-size="11" fill="#10b981">Activas en Cloud</text>
      <!-- Database vector icon -->
      <rect x="235" y="25" width="40" height="40" rx="8" fill="#eff6ff" />
      <path d="M245,37 C245,34 265,34 265,37 M245,37 L245,47 C245,50 265,50 265,47 L265,37 M245,42 C245,45 265,45 265,42" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Card 2: Usuarios Activos -->
    <g transform="translate(325, 50)" filter="url(#softShadow)">
      <rect width="295" height="90" rx="16" fill="#ffffff" />
      <rect width="5" height="90" rx="2.5" fill="#10b981" />
      <text x="20" y="32" font-family="sans-serif" font-weight="bold" font-size="11" fill="#94a3b8" letter-spacing="1">COLABORADORES</text>
      <text x="20" y="68" font-family="sans-serif" font-weight="900" font-size="32" fill="#0f172a">24</text>
      <text x="70" y="65" font-family="sans-serif" font-weight="bold" font-size="11" fill="#64748b">Asignados a vServer</text>
      <!-- User vector icon -->
      <rect x="235" y="25" width="40" height="40" rx="8" fill="#ecfdf5" />
      <circle cx="255" cy="41" r="4.5" fill="none" stroke="#10b981" stroke-width="2" />
      <path d="M247,51 C247,47 263,47 263,51" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Card 3: Grupos Totales -->
    <g transform="translate(645, 50)" filter="url(#softShadow)">
      <rect width="295" height="90" rx="16" fill="#ffffff" />
      <rect width="5" height="90" rx="2.5" fill="#f59e0b" />
      <text x="20" y="32" font-family="sans-serif" font-weight="bold" font-size="11" fill="#94a3b8" letter-spacing="1">GRUPOS DE TRABAJO</text>
      <text x="20" y="68" font-family="sans-serif" font-weight="900" font-size="32" fill="#0f172a">5</text>
      <text x="50" y="65" font-family="sans-serif" font-weight="bold" font-size="11" fill="#64748b">Roles de Seguridad</text>
      <!-- Tag vector icon -->
      <rect x="235" y="25" width="40" height="40" rx="8" fill="#fffbeb" />
      <path d="M246,36 L254,36 L264,46 L256,54 L246,44 Z" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" />
      <circle cx="250" cy="40" r="1.5" fill="#f59e0b" />
    </g>

    <!-- SPLITTED VIEW: COL 1 (Instancias Table) & COL 2 (Calendar & Groups) -->
    <!-- COL 1 (Left - Width: 590px) -->
    <g transform="translate(5, 165)" filter="url(#softShadow)">
      <rect width="595" height="400" rx="18" fill="#ffffff" />
      
      <!-- Table Header & Action -->
      <text x="25" y="35" font-family="sans-serif" font-weight="900" font-size="16" fill="#0f172a">Tus Entornos Dedicados (velneo)</text>
      <text x="25" y="52" font-family="sans-serif" font-size="11" fill="#64748b">Cada entorno dispone de un endpoint aislado 'url_api' para consultas locales.</text>

      <!-- Botón Nueva Instancia -->
      <g transform="translate(425, 18)" filter="url(#glowBlue)">
        <rect width="145" height="34" rx="8" fill="#2563eb" />
        <text x="72" y="21" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">+ Nueva Instancia</text>
      </g>

      <!-- Table Structure -->
      <g transform="translate(25, 75)" font-family="sans-serif" font-size="12">
        <!-- Table Column Titles -->
        <rect width="545" height="30" fill="#f8fafc" rx="6" />
        <text x="15" y="19" font-weight="bold" fill="#64748b">INSTANCIA / PROYECTO</text>
        <text x="175" y="19" font-weight="bold" fill="#64748b">ENDPOINT DE DATOS (url_api)</text>
        <text x="430" y="19" font-weight="bold" fill="#64748b" text-anchor="middle">ESTADO</text>
        <text x="500" y="19" font-weight="bold" fill="#64748b">ACCIONES</text>
        <line x1="0" y1="30" x2="545" y2="30" stroke="#e2e8f0" stroke-width="1" />

        <!-- Row 1: Sucursal Monterrey (Selected/Active) -->
        <g transform="translate(0, 30)">
          <!-- Indicator Background for Active/Selected tenant -->
          <rect width="545" height="52" fill="#eff6ff" fill-opacity="0.5" rx="6" />
          <text x="15" y="22" font-weight="bold" fill="#0f172a">Sucursal Monterrey</text>
          <text x="15" y="37" font-size="10" fill="#94a3b8">erp_core.vcd</text>
          
          <text x="175" y="22" fill="#2563eb" font-family="monospace">https://mty-api.dattaerp.com/v1</text>
          <text x="175" y="37" font-size="10" fill="#94a3b8">Grupo Velneo: CD_Mty (GRP_01)</text>

          <!-- Active Badge -->
          <rect x="390" y="16" width="80" height="20" rx="10" fill="#ecfdf5" />
          <text x="430" y="30" font-weight="bold" font-size="10" fill="#059669" text-anchor="middle">🟢 ACTIVO</text>

          <!-- Action buttons -->
          <rect x="495" y="13" width="40" height="24" rx="6" fill="#2563eb" />
          <text x="515" y="29" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">Ver</text>
          <line x1="0" y1="52" x2="545" y2="52" stroke="#e2e8f0" stroke-width="1" />
        </g>

        <!-- Row 2: Sucursal Guadalajara -->
        <g transform="translate(0, 82)">
          <text x="15" y="22" font-weight="bold" fill="#0f172a">Guadalajara (Ventas)</text>
          <text x="15" y="37" font-size="10" fill="#94a3b8">erp_ventas.vcd</text>
          
          <text x="175" y="22" fill="#64748b" font-family="monospace">https://gdl-api.dattaerp.com/v1</text>
          <text x="175" y="37" font-size="10" fill="#94a3b8">Grupo Velneo: CD_Gdl (GRP_02)</text>

          <!-- Provisioning Badge -->
          <rect x="390" y="16" width="80" height="20" rx="10" fill="#fffbeb" />
          <text x="430" y="30" font-weight="bold" font-size="10" fill="#d97706" text-anchor="middle">⚡ CREANDO</text>

          <rect x="495" y="13" width="40" height="24" rx="6" fill="#f1f5f9" />
          <text x="515" y="29" font-weight="bold" font-size="10" fill="#64748b" text-anchor="middle">Ver</text>
          <line x1="0" y1="52" x2="545" y2="52" stroke="#e2e8f0" stroke-width="1" />
        </g>

        <!-- Row 3: Sucursal Cancún -->
        <g transform="translate(0, 134)">
          <text x="15" y="22" font-weight="bold" fill="#0f172a">Cancún (Distribución)</text>
          <text x="15" y="37" font-size="10" fill="#94a3b8">erp_core.vcd</text>
          
          <text x="175" y="22" fill="#64748b" font-family="monospace">https://cun-api.dattaerp.com/v1</text>
          <text x="175" y="37" font-size="10" fill="#94a3b8">Grupo Velneo: CD_Cun (GRP_03)</text>

          <!-- Active Badge -->
          <rect x="390" y="16" width="80" height="20" rx="10" fill="#ecfdf5" />
          <text x="430" y="30" font-weight="bold" font-size="10" fill="#059669" text-anchor="middle">🟢 ACTIVO</text>

          <rect x="495" y="13" width="40" height="24" rx="6" fill="#f1f5f9" />
          <text x="515" y="29" font-weight="bold" font-size="10" fill="#64748b" text-anchor="middle">Ver</text>
          <line x1="0" y1="52" x2="545" y2="52" stroke="#e2e8f0" stroke-width="1" />
        </g>
      </g>

      <!-- Dynamic Data Loader alert info -->
      <g transform="translate(25, 335)">
        <rect width="545" height="42" rx="10" fill="#eff6ff" />
        <!-- Info symbol -->
        <circle cx="25" cy="21" r="7.5" fill="none" stroke="#2563eb" stroke-width="1.5" />
        <line x1="25" y1="18" x2="25" y2="25" stroke="#2563eb" stroke-width="2" />
        <text x="44" y="25" font-family="sans-serif" font-size="11" fill="#1e3a8a" font-weight="bold">👉 Estás visualizando la 'Sucursal Monterrey'. Los datos de la derecha se extraen de su 'url_api'.</text>
      </g>
    </g>

    <!-- COL 2 (Right - Width: 330px) -->
    <!-- 2A. CALENDARIO DE LA INSTANCIA -->
    <g transform="translate(615, 165)" filter="url(#softShadow)">
      <rect width="335" height="225" rx="18" fill="#ffffff" />
      <text x="20" y="32" font-family="sans-serif" font-weight="900" font-size="14" fill="#0f172a">Calendario (Sucursal Monterrey)</text>
      <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#64748b">Mayo 2026</text>

      <!-- Calendar Grid View -->
      <g transform="translate(20, 65)" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">
        <!-- Week Days -->
        <text x="15" y="0" text-anchor="middle">L</text>
        <text x="55" y="0" text-anchor="middle">M</text>
        <text x="95" y="0" text-anchor="middle">M</text>
        <text x="135" y="0" text-anchor="middle">J</text>
        <text x="175" y="0" text-anchor="middle">V</text>
        <text x="215" y="0" text-anchor="middle">S</text>
        <text x="255" y="0" text-anchor="middle">D</text>

        <!-- Calendar Days Row 1 -->
        <text x="15" y="25" fill="#cbd5e1">28</text>
        <text x="55" y="25" fill="#cbd5e1">29</text>
        <text x="95" y="25" fill="#cbd5e1">30</text>
        <text x="135" y="25" fill="#0f172a">1</text>
        <text x="175" y="25" fill="#0f172a">2</text>
        <text x="215" y="25" fill="#64748b">3</text>
        <text x="255" y="25" fill="#64748b">4</text>

        <!-- Calendar Days Row 2 -->
        <text x="15" y="50" fill="#0f172a">5</text>
        <text x="55" y="50" fill="#0f172a">6</text>
        <text x="95" y="50" fill="#0f172a">7</text>
        <text x="135" y="50" fill="#0f172a">8</text>
        <text x="175" y="50" fill="#0f172a">9</text>
        <!-- Highlighted Active Day -->
        <g transform="translate(195, 37)">
          <rect width="40" height="20" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
          <text x="20" y="13" fill="#2563eb" text-anchor="middle" font-weight="900">10</text>
        </g>
        <text x="255" y="50" fill="#64748b">11</text>

        <!-- Calendar Days Row 3 -->
        <text x="15" y="75" fill="#0f172a">12</text>
        <text x="55" y="75" fill="#0f172a">13</text>
        <text x="95" y="75" fill="#0f172a">14</text>
        <text x="135" y="75" fill="#0f172a">15</text>
        <text x="175" y="75" fill="#0f172a">16</text>
        <text x="215" y="75" fill="#64748b">17</text>
        <text x="255" y="75" fill="#64748b">18</text>

        <!-- Calendar Days Row 4 (Event Day) -->
        <text x="15" y="100" fill="#0f172a">19</text>
        <g transform="translate(35, 87)">
          <!-- Event marker -->
          <rect width="40" height="20" rx="6" fill="#fee2e2" />
          <text x="20" y="13" fill="#ef4444" text-anchor="middle" font-weight="900">20</text>
          <!-- Small dot indicator under day -->
          <circle cx="20" cy="17" r="1.5" fill="#ef4444" />
        </g>
        <text x="95" y="100" fill="#0f172a">21</text>
        <text x="135" y="100" fill="#0f172a">22</text>
        <text x="175" y="100" fill="#0f172a">23</text>
        <text x="215" y="100" fill="#64748b">24</text>
        <text x="255" y="100" fill="#64748b">25</text>
      </g>

      <!-- Mini indicator of the selected day's event -->
      <g transform="translate(20, 185)">
        <circle cx="10" cy="10" r="5" fill="#ef4444" />
        <text x="24" y="13" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">May 20: <tspan font-weight="normal" fill="#64748b">Cierre de Caja Monterrey (18:00h)</tspan></text>
      </g>
    </g>

    <!-- 2B. GRUPOS DE LA INSTANCIA -->
    <g transform="translate(615, 405)" filter="url(#softShadow)">
      <rect width="335" height="160" rx="18" fill="#ffffff" />
      <text x="20" y="28" font-family="sans-serif" font-weight="900" font-size="14" fill="#0f172a">Grupos en vServer (Mty)</text>
      
      <!-- Groups list -->
      <g transform="translate(20, 42)" font-family="sans-serif" font-size="11">
        <!-- Group 1: Administradores -->
        <g transform="translate(0, 5)">
          <rect width="295" height="30" rx="8" fill="#f8fafc" />
          <text x="15" y="19" font-weight="bold" fill="#0f172a">🔑 Administradores</text>
          <text x="280" y="19" fill="#2563eb" font-weight="bold" text-anchor="end">4 usuarios</text>
        </g>

        <!-- Group 2: Ventas -->
        <g transform="translate(0, 40)">
          <rect width="295" height="30" rx="8" fill="#f8fafc" />
          <text x="15" y="19" font-weight="bold" fill="#0f172a">🛒 Equipo de Ventas</text>
          <text x="280" y="19" fill="#2563eb" font-weight="bold" text-anchor="end">14 usuarios</text>
        </g>

        <!-- Group 3: Contabilidad -->
        <g transform="translate(0, 75)">
          <rect width="295" height="30" rx="8" fill="#f8fafc" />
          <text x="15" y="19" font-weight="bold" fill="#0f172a">📊 Contadores y Auditores</text>
          <text x="280" y="19" fill="#2563eb" font-weight="bold" text-anchor="end">6 usuarios</text>
        </g>
      </g>
    </g>
  </g>
</svg>
