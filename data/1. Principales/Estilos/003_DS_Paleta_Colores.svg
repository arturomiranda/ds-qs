<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1000" font-family="'Roboto', 'Segoe UI', system-ui, sans-serif">
  <rect width="950" height="1000" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="50" font-size="24" font-weight="bold" fill="#121217">PALETA DE COLORES</text>
  <path d="M 40 70 L 910 70" stroke="#D1D1DB" stroke-width="1"/>

  <!-- ======================== FILA 1 ======================== -->

  <!-- Grupo 1: Acciones (Azules) -->
  <text x="40" y="110" font-size="16" font-weight="bold" fill="#3F3F50">COLORES PRIMARIOS (ACCIÓN Y FOCO)</text>
  
  <g transform="translate(40, 140)">
    <!-- Bloque 1 -->
    <rect width="100" height="100" fill="#00ACFF" rx="8"/>
    <text x="10" y="85" font-family="monospace" fill="#ffffff" font-weight="bold">#00ACFF</text>
    <text x="120" y="30" font-size="14" font-weight="bold" fill="#121217">Blue Primary</text>
    <text x="120" y="55" font-size="12" fill="#6C6C89">Uso: Botón Aceptar, Bordes Focus,</text>
    <text x="120" y="75" font-size="12" fill="#6C6C89">Hover, Selección en tablas.</text>

    <!-- Bloque 2 -->
    <rect x="0" y="130" width="100" height="100" fill="#0090D6" rx="8"/>
    <text x="10" y="215" font-family="monospace" fill="#ffffff" font-weight="bold">#0090D6</text>
    <text x="120" y="160" font-size="14" font-weight="bold" fill="#121217">Blue Hover / Pressed</text>
    <text x="120" y="185" font-size="12" fill="#6C6C89">Uso: Interacción (clic o hover)</text>
    <text x="120" y="205" font-size="12" fill="#6C6C89">sobre botones primarios.</text>

    <!-- Bloque 3 -->
    <rect x="0" y="260" width="100" height="100" fill="#ADE4FF" rx="8"/>
    <text x="10" y="345" font-family="monospace" fill="#121217" font-weight="bold">#ADE4FF</text>
    <text x="120" y="290" font-size="14" font-weight="bold" fill="#121217">Light Blue Selection</text>
    <text x="120" y="315" font-size="12" fill="#6C6C89">Uso: Fondo de selección de texto</text>
    <text x="120" y="335" font-size="12" fill="#6C6C89">en las cajas de texto (QLineEdit).</text>
  </g>

  <!-- Grupo 2: Fondos y Superficies -->
  <text x="480" y="110" font-size="16" font-weight="bold" fill="#3F3F50">FONDOS Y SUPERFICIES (GRISES CLAROS)</text>
  
  <g transform="translate(480, 140)">
    <!-- Bloque 1 -->
    <rect width="100" height="100" fill="#F5F5F5" rx="8" stroke="#D1D1DB"/>
    <text x="10" y="85" font-family="monospace" fill="#3F3F50" font-weight="bold">#F5F5F5</text>
    <text x="120" y="30" font-size="14" font-weight="bold" fill="#121217">Base Gray</text>
    <text x="120" y="55" font-size="12" fill="#6C6C89">Uso: Fondo App, Formulario,</text>
    <text x="120" y="75" font-size="12" fill="#6C6C89">Inputs y botones estándar.</text>

    <!-- Bloque 2 -->
    <rect x="0" y="130" width="100" height="100" fill="#EBEBEF" rx="8" stroke="#D1D1DB"/>
    <text x="10" y="215" font-family="monospace" fill="#3F3F50" font-weight="bold">#EBEBEF</text>
    <text x="120" y="160" font-size="14" font-weight="bold" fill="#121217">Disabled / Separator</text>
    <text x="120" y="185" font-size="12" fill="#6C6C89">Uso: Controles inactivos (disabled),</text>
    <text x="120" y="205" font-size="12" fill="#6C6C89">fondos bloqueados, barras de progreso.</text>

    <!-- Bloque 3 -->
    <rect x="0" y="260" width="100" height="100" fill="#D1D1DB" rx="8" stroke="#D1D1DB"/>
    <text x="10" y="345" font-family="monospace" fill="#3F3F50" font-weight="bold">#D1D1DB</text>
    <text x="120" y="290" font-size="14" font-weight="bold" fill="#121217">Border Gray</text>
    <text x="120" y="315" font-size="12" fill="#6C6C89">Uso: Bordes generales, scrollbars,</text>
    <text x="120" y="335" font-size="12" fill="#6C6C89">switches en estado apagado.</text>
  </g>

  <!-- ======================== FILA 2 ======================== -->

  <!-- Grupo 3: Textos (Escala de Grises Oscura) -->
  <text x="40" y="540" font-size="16" font-weight="bold" fill="#3F3F50">TEXTOS Y ETIQUETAS</text>

  <g transform="translate(40, 560)">
    <rect width="60" height="60" fill="#121217" rx="8"/>
    <text x="80" y="25" font-family="monospace" fill="#121217" font-weight="bold">#121217</text>
    <text x="80" y="45" font-size="12" fill="#6C6C89">Texto Principal (Inputs)</text>

    <rect x="0" y="80" width="60" height="60" fill="#3F3F50" rx="8"/>
    <text x="80" y="105" font-family="monospace" fill="#121217" font-weight="bold">#3F3F50</text>
    <text x="80" y="125" font-size="12" fill="#6C6C89">Texto Secundario (Botones)</text>

    <rect x="0" y="160" width="60" height="60" fill="#6C6C89" rx="8"/>
    <text x="80" y="185" font-family="monospace" fill="#121217" font-weight="bold">#6C6C89</text>
    <text x="80" y="205" font-size="12" fill="#6C6C89">Etiquetas y Checkboxes</text>

    <rect x="0" y="240" width="60" height="60" fill="#8A8AA3" rx="8"/>
    <text x="80" y="265" font-family="monospace" fill="#121217" font-weight="bold">#8A8AA3</text>
    <text x="80" y="285" font-size="12" fill="#6C6C89">Pestañas Inactivas y Títulos</text>

    <rect x="0" y="320" width="60" height="60" fill="#A9A9BC" rx="8"/>
    <text x="80" y="345" font-family="monospace" fill="#121217" font-weight="bold">#A9A9BC</text>
    <text x="80" y="365" font-size="12" fill="#6C6C89">Progress Bars y GBox</text>
  </g>

  <!-- Grupo 4: Otros (Advertencia y Dark UI) -->
  <text x="480" y="540" font-size="16" font-weight="bold" fill="#3F3F50">COLORES ESPECIALES</text>
  
  <g transform="translate(480, 560)">
    <!-- Warning -->
    <rect width="100" height="60" fill="#FDD8E1" rx="8"/>
    <text x="120" y="25" font-family="monospace" fill="#121217" font-weight="bold">#FDD8E1</text>
    <text x="120" y="45" font-size="12" fill="#6C6C89">Botón Advertencia / Suprimir</text>

    <!-- Dark Mode Panel -->
    <rect x="0" y="80" width="100" height="60" fill="#282833" rx="8"/>
    <text x="120" y="105" font-family="monospace" fill="#121217" font-weight="bold">#282833</text>
    <text x="120" y="125" font-size="12" fill="#6C6C89">Notificaciones / Menú Lateral Izq.</text>

    <!-- Logo Background -->
    <rect x="0" y="160" width="100" height="60" fill="#FFDA85" rx="8"/>
    <text x="120" y="185" font-family="monospace" fill="#121217" font-weight="bold">#FFDA85</text>
    <text x="120" y="205" font-size="12" fill="#6C6C89">Fondo de Icono de Empresa</text>
  </g>

</svg>
