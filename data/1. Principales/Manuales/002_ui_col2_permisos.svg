<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Sombras -->
    <filter id="shadow-card" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-note" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#cbd5e1" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    
    <!-- Icono Check -->
    <path id="check-icon" d="M 3 8 L 6 11 L 11 4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <rect width="1150" height="780" fill="#f8fafc"/>

  <!-- ==========================================
       SECCIÓN IZQUIERDA: MOCKUP EXACTO COLUMNA 2
       ========================================== -->
  <g transform="translate(30, 30)">
    
    <!-- 1. HEADER GLOBAL (Vendedores) -->
    <rect x="0" y="0" width="750" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Icono Editar (Morado) -->
    <rect x="25" y="25" width="24" height="24" fill="#ffffff" rx="4"/>
    <path d="M 38 27 L 43 32 L 32 43 L 27 43 L 27 38 Z" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 27 48 L 45 48" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="55" y="45" font-weight="800" fill="#1e293b" font-size="28">Vendedores</text>
    <text x="25" y="70" fill="#64748b" font-size="14">Usuarios de venta</text>

    <!-- Botón: Mostrar Vista Previa -->
    <rect x="360" y="25" width="130" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <circle cx="375" cy="43" r="5" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 375 40 L 375 43 L 378 45" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <text x="388" y="48" font-weight="bold" fill="#334155" font-size="11">Mostrar Vista Previa</text>

    <!-- Botón: Habilitar Todo -->
    <rect x="500" y="25" width="110" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <rect x="510" y="37" width="12" height="12" fill="#4f46e5" rx="2"/>
    <path d="M 513 43 L 515 45 L 519 39" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="528" y="48" font-weight="bold" fill="#334155" font-size="11">Habilitar Todo</text>

    <!-- Botón: Bloquear Todo -->
    <rect x="620" y="25" width="110" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <rect x="630" y="37" width="12" height="12" fill="#ef4444" rx="2"/>
    <path d="M 633 43 L 639 43" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="648" y="48" font-weight="bold" fill="#334155" font-size="11">Bloquear Todo</text>

    <!-- 2. CARD DEL MÓDULO (CONFIGURACION) -->
    <rect x="25" y="120" width="700" height="400" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12" filter="url(#shadow-card)"/>
    
    <!-- Cabecera del Módulo -->
    <rect x="45" y="140" width="40" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="8"/>
    <!-- Icono Caja simple -->
    <path d="M 55 160 L 65 155 L 75 160 L 65 165 Z" fill="#fcd34d"/>
    <path d="M 55 160 L 65 165 L 65 175 L 55 170 Z" fill="#f59e0b"/>
    <path d="M 75 160 L 65 165 L 65 175 L 75 170 Z" fill="#d97706"/>

    <text x="100" y="160" font-weight="bold" fill="#1e293b" font-size="18">Módulo: CONFIGURACION</text>
    <text x="100" y="180" fill="#64748b" font-size="13">Permisos para submenús</text>

    <!-- Botones del Módulo -->
    <rect x="520" y="145" width="85" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <rect x="528" y="154" width="10" height="10" fill="#4f46e5" rx="2"/>
    <path d="M 530 159 L 532 161 L 536 156" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="543" y="164" font-weight="bold" fill="#334155" font-size="11">Habilitar</text>

    <rect x="615" y="145" width="90" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <rect x="623" y="154" width="10" height="10" fill="#ef4444" rx="2"/>
    <path d="M 625 159 L 631 159" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="638" y="164" font-weight="bold" fill="#334155" font-size="11">Bloquear</text>

    <!-- Línea separadora -->
    <path d="M 25 200 L 725 200" stroke="#f1f5f9" stroke-width="2"/>

    <!-- FILA 1: Usuarios (Inactiva) -->
    <g transform="translate(0, 200)" opacity="0.4">
      <text x="45" y="45" font-weight="bold" fill="#1e293b" font-size="14">• Usuarios</text>
      
      <!-- Toggle Off -->
      <rect x="290" y="32" width="45" height="24" fill="#cbd5e1" rx="12"/>
      <circle cx="302" cy="44" r="10" fill="#ffffff"/>
      <text x="345" y="48" font-weight="bold" fill="#4f46e5" font-size="12">ACCESO</text>

      <!-- Divisor Vertical -->
      <path d="M 430 20 L 430 80" stroke="#f1f5f9" stroke-width="2"/>

      <!-- CRUD Checkboxes (Off) -->
      <text x="450" y="30" font-weight="800" fill="#94a3b8" font-size="9" letter-spacing="1">OPERACIONES CRUD:</text>
      
      <rect x="450" y="40" width="14" height="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="2"/>
      <text x="470" y="52" fill="#94a3b8" font-size="13">Agregar</text>

      <rect x="535" y="40" width="14" height="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="2"/>
      <text x="555" y="52" fill="#94a3b8" font-size="13">Editar</text>

      <rect x="610" y="40" width="14" height="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="2"/>
      <text x="630" y="52" fill="#94a3b8" font-size="13">Eliminar</text>

      <rect x="695" y="40" width="14" height="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="2"/>
      <text x="715" y="52" fill="#94a3b8" font-size="13">Cancelar</text>

      <!-- Segunda fila de checkboxes -->
      <rect x="450" y="65" width="14" height="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="2"/>
      <text x="470" y="77" fill="#94a3b8" font-size="13">Opcion Lista</text>

      <!-- Separador de fila -->
      <path d="M 25 100 L 725 100" stroke="#f1f5f9" stroke-width="2"/>
    </g>

    <!-- FILA 2: Grupos de Usuarios (Activa) -->
    <g transform="translate(0, 300)">
      <text x="45" y="45" font-weight="bold" fill="#1e293b" font-size="14">• Grupos de Usuarios</text>
      
      <!-- Toggle On -->
      <rect x="290" y="32" width="45" height="24" fill="#4f46e5" rx="12"/>
      <circle cx="323" cy="44" r="10" fill="#ffffff"/>
      <text x="345" y="48" font-weight="bold" fill="#4f46e5" font-size="12">ACCESO</text>

      <!-- Divisor Vertical -->
      <path d="M 430 20 L 430 80" stroke="#f1f5f9" stroke-width="2"/>

      <!-- CRUD Checkboxes (On) -->
      <text x="450" y="30" font-weight="800" fill="#94a3b8" font-size="9" letter-spacing="1">OPERACIONES CRUD:</text>
      
      <g transform="translate(450, 40)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="470" y="52" font-weight="bold" fill="#1e293b" font-size="13">Agregar</text>

      <g transform="translate(535, 40)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="555" y="52" font-weight="bold" fill="#1e293b" font-size="13">Editar</text>

      <g transform="translate(610, 40)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="630" y="52" font-weight="bold" fill="#1e293b" font-size="13">Eliminar</text>

      <g transform="translate(695, 40)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="715" y="52" font-weight="bold" fill="#1e293b" font-size="13">Cancelar</text>

      <!-- Segunda fila de checkboxes -->
      <g transform="translate(450, 65)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="470" y="77" font-weight="bold" fill="#1e293b" font-size="13">Opcion Lista</text>

      <!-- Separador de fila -->
      <path d="M 25 100 L 725 100" stroke="#f1f5f9" stroke-width="2"/>
    </g>

    <!-- FILA 3: Empresas (Activa) -->
    <g transform="translate(0, 400)">
      <text x="45" y="45" font-weight="bold" fill="#1e293b" font-size="14">• Empresas</text>
      
      <!-- Toggle On -->
      <rect x="290" y="32" width="45" height="24" fill="#4f46e5" rx="12"/>
      <circle cx="323" cy="44" r="10" fill="#ffffff"/>
      <text x="345" y="48" font-weight="bold" fill="#4f46e5" font-size="12">ACCESO</text>

      <!-- Divisor Vertical -->
      <path d="M 430 20 L 430 80" stroke="#f1f5f9" stroke-width="2"/>

      <!-- CRUD Checkboxes (On) -->
      <text x="450" y="30" font-weight="800" fill="#94a3b8" font-size="9" letter-spacing="1">OPERACIONES CRUD:</text>
      
      <g transform="translate(450, 40)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="470" y="52" font-weight="bold" fill="#1e293b" font-size="13">Agregar</text>

      <g transform="translate(535, 40)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="555" y="52" font-weight="bold" fill="#1e293b" font-size="13">Editar</text>

      <g transform="translate(610, 40)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="630" y="52" font-weight="bold" fill="#1e293b" font-size="13">Eliminar</text>

      <g transform="translate(695, 40)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="715" y="52" font-weight="bold" fill="#1e293b" font-size="13">Cancelar</text>

      <!-- Segunda fila de checkboxes -->
      <g transform="translate(450, 65)"><rect width="14" height="14" fill="#0ea5e9" rx="2"/><use href="#check-icon"/></g>
      <text x="470" y="77" font-weight="bold" fill="#1e293b" font-size="13">Opcion Lista</text>
    </g>

    <!-- Scrollbar (Simulada a la derecha) -->
    <rect x="740" y="120" width="6" height="400" fill="#e2e8f0" rx="3"/>
    <rect x="740" y="250" width="6" height="150" fill="#cbd5e1" rx="3"/>

  </g>

  <!-- ==========================================
       SECCIÓN DERECHA: EXPLICACIONES (CERO TECNICISMOS)
       ========================================== -->
       
  <!-- Anotación 1: Encabezado Global y Botones Masivos -->
  <path d="M 640 60 Q 750 60 780 100" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="800" y="65" width="310" height="85" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="820" y="90" font-weight="bold" fill="#1e293b" font-size="14">⚡ Acciones Rápidas Generales</text>
  <text x="820" y="112" fill="#64748b" font-size="13">En la parte superior, tiene botones para</text>
  <text x="820" y="130" fill="#64748b" font-size="13">habilitar o bloquear absolutamente todos los</text>
  <text x="820" y="148" fill="#64748b" font-size="13">permisos de este rol con un solo clic.</text>

  <!-- Anotación 2: Agrupación por Módulo -->
  <path d="M 500 175 Q 750 175 780 230" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="800" y="195" width="310" height="85" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="820" y="220" font-weight="bold" fill="#1e293b" font-size="14">📦 Bloques por Módulo</text>
  <text x="820" y="242" fill="#64748b" font-size="13">Los permisos se agrupan ordenadamente en</text>
  <text x="820" y="260" fill="#64748b" font-size="13">cajas grandes (como CONFIGURACIÓN). También</text>
  <text x="820" y="278" fill="#64748b" font-size="13">puede prender o apagar el bloque entero.</text>

  <!-- Anotación 3: Interruptor de Acceso -->
  <path d="M 370 365 Q 600 365 780 345" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="800" y="325" width="310" height="70" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="820" y="350" font-weight="bold" fill="#1e293b" font-size="14">🔘 Control de Entrada</text>
  <text x="820" y="372" fill="#64748b" font-size="13">Este interruptor maestro decide si el usuario</text>
  <text x="820" y="390" fill="#64748b" font-size="13">podrá ver o no esta pantalla en su menú.</text>

  <!-- Anotación 4: Privilegios de Edición -->
  <path d="M 680 470 Q 750 470 780 480" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="800" y="440" width="310" height="85" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="820" y="465" font-weight="bold" fill="#1e293b" font-size="14">✅ Permisos de Escritura</text>
  <text x="820" y="487" fill="#64748b" font-size="13">Si tienen acceso, estas casillas de color azul</text>
  <text x="820" y="505" fill="#64748b" font-size="13">le permiten decidir si podrán Agregar, Editar,</text>
  <text x="820" y="523" fill="#64748b" font-size="13">Eliminar o Cancelar datos.</text>

  <!-- Anotación 5: Fila Desactivada -->
  <path d="M 520 285 Q 750 285 780 580" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="800" y="540" width="310" height="85" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="820" y="565" font-weight="bold" fill="#1e293b" font-size="14">🚫 Accesos Restringidos</text>
  <text x="820" y="587" fill="#64748b" font-size="13">Si usted apaga un menú, sus casillas de edición</text>
  <text x="820" y="605" fill="#64748b" font-size="13">se bloquean visualmente en gris transparente</text>
  <text x="820" y="623" fill="#64748b" font-size="13">para confirmar que el usuario no tiene acceso.</text>

</svg>
