<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Same bg and left panel -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />

  <!-- Panel Izquierdo (Branding) -->
  <rect width="540" height="720" fill="url(#leftPanel)" />
  <text x="50" y="80" font-family="sans-serif" font-weight="bold" font-size="28" fill="#fff">🚀 Datta ERP</text>
  <text x="50" y="250" font-family="sans-serif" font-weight="bold" font-size="48" fill="#fff">Gestión empresarial</text>
  <text x="50" y="310" font-family="sans-serif" font-weight="bold" font-size="48" fill="#fff">inteligente</text>
  
  <!-- Panel Derecho (Formulario OTP) -->
  <g transform="translate(680, 150)">
    <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="32" fill="#18181b">Verifica tu correo</text>
    <text x="0" y="30" font-family="sans-serif" font-size="16" fill="#71717a">Hemos enviado un código a <tspan fill="#18181b" font-weight="bold">william@empresa.com</tspan></text>

    <rect y="70" width="480" height="350" rx="24" fill="#ffffff" filter="url(#shadow)" stroke="#e4e4e7" />
    
    <g transform="translate(40, 110)">
      <!-- Mail Icon Bubble -->
      <circle cx="200" cy="30" r="30" fill="#eff6ff" />
      <text x="200" y="38" font-family="sans-serif" font-size="24" text-anchor="middle">✉️</text>

      <text x="200" y="90" font-family="sans-serif" font-weight="bold" font-size="20" fill="#18181b" text-anchor="middle">Verifica tu correo</text>

      <text x="200" y="140" font-family="sans-serif" font-weight="bold" font-size="10" fill="#a1a1aa" letter-spacing="1" text-anchor="middle">CÓDIGO DE VERIFICACIÓN</text>
      
      <rect x="0" y="150" width="400" height="60" rx="12" fill="#f4f4f5" stroke="#e4e4e7" />
      <text x="200" y="190" font-family="monospace" font-weight="bold" font-size="28" fill="#18181b" letter-spacing="15" text-anchor="middle">482917</text>

      <rect x="0" y="230" width="400" height="50" rx="12" fill="#2563eb" />
      <text x="200" y="260" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fff" text-anchor="middle">Confirmar Registro</text>

      <text x="200" y="300" font-family="sans-serif" font-size="14" fill="#71717a" text-anchor="middle">← Volver al registro</text>
    </g>
  </g>
</svg>
