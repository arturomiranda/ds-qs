<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 700" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="shadow-note" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#cbd5e1" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow-panel" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Fondo base (Documento) -->
  <rect width="850" height="700" fill="#f8fafc"/>

  <!-- ==========================================
       SECCIÓN IZQUIERDA: MOCKUP COLUMNA 3
       ========================================== -->
  <g transform="translate(30, 30)">
    
    <!-- Contenedor Principal Dark UI -->
    <rect x="0" y="0" width="370" height="640" fill="#0a0f1c" rx="4" filter="url(#shadow-panel)"/>
    
    <!-- HEADER -->
    <circle cx="35" cy="40" r="4" fill="#10b981"/>
    <!-- Brillo verde -->
    <circle cx="35" cy="40" r="8" fill="#10b981" opacity="0.3"/>
    
    <text x="50" y="45" font-weight="900" fill="#ffffff" font-size="16" letter-spacing="1">PREVIEW ERP</text>

    <!-- Badge Real-time -->
    <rect x="250" y="27" width="90" height="26" fill="#1e1b4b" opacity="0.8" rx="4"/>
    <text x="260" y="44" font-family="monospace" font-weight="bold" fill="#818cf8" font-size="12">Real-time</text>

    <path d="M 0 70 L 370 70" stroke="#1e293b" stroke-width="2"/>

    <!-- CAJA DE INSTRUCCIONES -->
    <rect x="30" y="95" width="310" height="85" fill="#1e293b" opacity="0.4" stroke="#1e293b" stroke-width="1" rx="8"/>
    <text x="45" y="125" fill="#64748b" font-size="13">Así es como se renderizaría el menú para</text>
    <text x="45" y="145" fill="#64748b" font-size="13">el usuario. Se actualiza</text>
    <text x="45" y="165" fill="#64748b" font-size="13">automáticamente.</text>

    <!-- SECCIÓN: CATALOGOS -->
    <path d="M 30 215 L 30 235" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
    <text x="42" y="230" font-weight="800" fill="#94a3b8" font-size="12" letter-spacing="1.5">CATALOGOS</text>

    <!-- Fila: Entidades -->
    <rect x="30" y="250" width="310" height="50" fill="#1e293b" opacity="0.4" stroke="#1e293b" stroke-width="1" rx="8"/>
    <text x="50" y="280" font-weight="bold" fill="#f8fafc" font-size="14">• Entidades</text>
    
    <!-- Badges CRUD -->
    <g transform="translate(160, 265)">
      <!-- C -->
      <rect x="0" y="0" width="22" height="22" fill="#4f46e5" opacity="0.25" rx="4"/>
      <text x="6" y="15" font-weight="900" fill="#a5b4fc" font-size="11">C</text>
      <!-- R -->
      <rect x="28" y="0" width="22" height="22" fill="#10b981" opacity="0.25" rx="4"/>
      <text x="34" y="15" font-weight="900" fill="#6ee7b7" font-size="11">R</text>
      <!-- U -->
      <rect x="56" y="0" width="22" height="22" fill="#f59e0b" opacity="0.25" rx="4"/>
      <text x="62" y="15" font-weight="900" fill="#fcd34d" font-size="11">U</text>
      <!-- D -->
      <rect x="84" y="0" width="22" height="22" fill="#f43f5e" opacity="0.25" rx="4"/>
      <text x="90" y="15" font-weight="900" fill="#fda4af" font-size="11">D</text>
      <!-- X -->
      <rect x="112" y="0" width="22" height="22" fill="#334155" opacity="0.6" rx="4"/>
      <text x="118" y="15" font-weight="900" fill="#94a3b8" font-size="11">X</text>
      <!-- L -->
      <rect x="140" y="0" width="22" height="22" fill="#334155" opacity="0.6" rx="4"/>
      <text x="146" y="15" font-weight="900" fill="#94a3b8" font-size="11">L</text>
    </g>


    <!-- SECCIÓN: CONFIGURACION -->
    <path d="M 30 335 L 30 355" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
    <text x="42" y="350" font-weight="800" fill="#94a3b8" font-size="12" letter-spacing="1.5">CONFIGURACION</text>

    <!-- Fila: Grupos de Usuarios -->
    <rect x="30" y="370" width="310" height="65" fill="#1e293b" opacity="0.4" stroke="#1e293b" stroke-width="1" rx="8"/>
    <text x="50" y="395" font-weight="bold" fill="#f8fafc" font-size="14">• Grupos de</text>
    <text x="50" y="415" font-weight="bold" fill="#f8fafc" font-size="14">Usuarios</text>

    <!-- Badges CRUD -->
    <g transform="translate(160, 390)">
      <rect x="0" y="0" width="22" height="22" fill="#4f46e5" opacity="0.25" rx="4"/>
      <text x="6" y="15" font-weight="900" fill="#a5b4fc" font-size="11">C</text>
      <rect x="28" y="0" width="22" height="22" fill="#10b981" opacity="0.25" rx="4"/>
      <text x="34" y="15" font-weight="900" fill="#6ee7b7" font-size="11">R</text>
      <rect x="56" y="0" width="22" height="22" fill="#f59e0b" opacity="0.25" rx="4"/>
      <text x="62" y="15" font-weight="900" fill="#fcd34d" font-size="11">U</text>
      <rect x="84" y="0" width="22" height="22" fill="#f43f5e" opacity="0.25" rx="4"/>
      <text x="90" y="15" font-weight="900" fill="#fda4af" font-size="11">D</text>
      <rect x="112" y="0" width="22" height="22" fill="#334155" opacity="0.6" rx="4"/>
      <text x="118" y="15" font-weight="900" fill="#94a3b8" font-size="11">X</text>
      <rect x="140" y="0" width="22" height="22" fill="#334155" opacity="0.6" rx="4"/>
      <text x="146" y="15" font-weight="900" fill="#94a3b8" font-size="11">L</text>
    </g>

    <!-- Fila: Empresas -->
    <rect x="30" y="450" width="310" height="50" fill="#1e293b" opacity="0.4" stroke="#1e293b" stroke-width="1" rx="8"/>
    <text x="50" y="480" font-weight="bold" fill="#f8fafc" font-size="14">• Empresas</text>

    <!-- Badges CRUD -->
    <g transform="translate(160, 465)">
      <rect x="0" y="0" width="22" height="22" fill="#4f46e5" opacity="0.25" rx="4"/>
      <text x="6" y="15" font-weight="900" fill="#a5b4fc" font-size="11">C</text>
      <rect x="28" y="0" width="22" height="22" fill="#10b981" opacity="0.25" rx="4"/>
      <text x="34" y="15" font-weight="900" fill="#6ee7b7" font-size="11">R</text>
      <rect x="56" y="0" width="22" height="22" fill="#f59e0b" opacity="0.25" rx="4"/>
      <text x="62" y="15" font-weight="900" fill="#fcd34d" font-size="11">U</text>
      <rect x="84" y="0" width="22" height="22" fill="#f43f5e" opacity="0.25" rx="4"/>
      <text x="90" y="15" font-weight="900" fill="#fda4af" font-size="11">D</text>
      <rect x="112" y="0" width="22" height="22" fill="#334155" opacity="0.6" rx="4"/>
      <text x="118" y="15" font-weight="900" fill="#94a3b8" font-size="11">X</text>
      <rect x="140" y="0" width="22" height="22" fill="#334155" opacity="0.6" rx="4"/>
      <text x="146" y="15" font-weight="900" fill="#94a3b8" font-size="11">L</text>
    </g>
  </g>

  <!-- ==========================================
       SECCIÓN DERECHA: EXPLICACIONES (CERO TECNICISMOS)
       ========================================== -->
       
  <!-- Anotación 1: Header Real-time -->
  <path d="M 330 60 Q 450 60 480 100" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="500" y="65" width="310" height="85" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="520" y="90" font-weight="bold" fill="#1e293b" font-size="14">⚡ Simulador en Vivo</text>
  <text x="520" y="112" fill="#64748b" font-size="13">Esta sección es un "espejo". Lo que el usuario</text>
  <text x="520" y="130" fill="#64748b" font-size="13">verá en su menú real, usted lo comprueba aquí</text>
  <text x="520" y="148" fill="#64748b" font-size="13">al instante mientras configura.</text>

  <!-- Anotación 2: Agrupación en Carpetas -->
  <path d="M 230 255 Q 450 255 480 235" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="500" y="195" width="310" height="85" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="520" y="220" font-weight="bold" fill="#1e293b" font-size="14">📂 Carpetas Reales del Sistema</text>
  <text x="520" y="242" fill="#64748b" font-size="13">El sistema organiza automáticamente los permisos</text>
  <text x="520" y="260" fill="#64748b" font-size="13">en los módulos principales del ERP (como</text>
  <text x="520" y="278" fill="#64748b" font-size="13">Catálogos o Configuración).</text>

  <!-- Anotación 3: Badges CRUD -->
  <path d="M 370 410 Q 450 410 480 395" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="500" y="355" width="310" height="85" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="520" y="380" font-weight="bold" fill="#1e293b" font-size="14">🎨 Etiquetas de Privilegios</text>
  <text x="520" y="402" fill="#64748b" font-size="13">Estas pequeñas etiquetas de colores le</text>
  <text x="520" y="420" fill="#64748b" font-size="13">confirman visualmente las operaciones que acaba</text>
  <text x="520" y="438" fill="#64748b" font-size="13">de autorizar: Crear (C), Leer (R), Modificar (U)...</text>

  <!-- Anotación 4: Ocultamiento Inteligente -->
  <path d="M 250 515 Q 450 535 480 545" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="500" y="505" width="310" height="85" fill="#ffffff" stroke="#e2e8f0" rx="6" filter="url(#shadow-note)"/>
  <text x="520" y="530" font-weight="bold" fill="#1e293b" font-size="14">👻 Menús Invisibles</text>
  <text x="520" y="552" fill="#64748b" font-size="13">Para mayor seguridad, si un grupo no tiene</text>
  <text x="520" y="570" fill="#64748b" font-size="13">autorizado un menú, este desaparece por</text>
  <text x="520" y="588" fill="#64748b" font-size="13">completo de esta lista.</text>

</svg>
