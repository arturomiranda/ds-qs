<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Actual Datta ERP background gradient matching bg-gradient-to-br from-blue-950 to-slate-950 -->
    <linearGradient id="degradadoFondo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Real glowing blobs representing sky-500/10 and blue-500/10 in the app layout -->
    <radialGradient id="glowSky" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Professional card shadow filter matching shadow-2xl shadow-black/45 -->
    <filter id="sombraSuave" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <linearGradient id="degradadoBoton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="degradadoAlerta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
  </defs>

  <!-- Modern Background -->
  <rect width="1280" height="720" fill="url(#degradadoFondo)" />
  <rect width="1280" height="720" fill="url(#glowSky)" />
  <rect width="1280" height="720" fill="url(#glowBlue)" />

  <!-- Clean Grid Lines representing abstract technology branding -->
  <path d="M0,80 L1280,80 M0,160 L1280,160 M0,240 L1280,240 M0,320 L1280,320 M0,400 L1280,400 M0,480 L1280,480 M0,560 L1280,560 M0,640 L1280,640" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
  <path d="M160,0 L160,720 M320,0 L320,720 M480,0 L480,720 M640,0 L640,720 M800,0 L800,720 M960,0 L960,720 M1120,0 L1120,720" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />

  <!-- Cabecera de la maqueta (White and Slate-400 for high-end contrast on dark background) -->
  <text x="640" y="60" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">FLUJO DE ACCESO Y RECUPERACIÓN — DATTA ERP</text>
  <text x="640" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Especificación de Interfaz de Usuario y Estados de Control (SaaS)</text>

  <!-- ================= VISTA 1: LOGIN ESTÁNDAR ================= -->
  <g transform="translate(60, 130)" filter="url(#sombraSuave)">
    <!-- Contenedor Tarjeta (Rx 24 for premium rounded design) -->
    <rect width="360" height="500" rx="24" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Logo e Identidad (Centered horizontal corporate logo inside card) -->
    <g transform="translate(180, 20)">
      <rect x="-65" y="0" width="30" height="30" rx="7" fill="#2563eb" />
      <path d="M-54,7 L-54,23 L-49,23 C-44,23 -41,20 -41,15 C-41,10 -44,7 -49,7 Z" fill="#ffffff" />
      <path d="M-51,11 L-51,19 L-48,19 C-46,19 -44,18 -44,15 C-44,12 -46,11 -48,11 Z" fill="#2563eb" />
      <text x="-25" y="18" font-family="sans-serif" font-weight="900" font-size="16" fill="#0f172a" letter-spacing="0.5">DATTA <tspan fill="#2563eb" font-weight="500">ERP</tspan></text>
      <text x="-25" y="27" font-family="sans-serif" font-weight="700" font-size="6" fill="#94a3b8" letter-spacing="1">SOCIOS DE TU CRECIMIENTO</text>
    </g>
    
    <text x="180" y="90" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A">Iniciar Sesión</text>
    <text x="180" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#64748B">Ingresa a tu consola administrativa</text>

    <!-- Campos de Entrada (Inputs) -->
    <!-- Correo -->
    <text x="35" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">CORREO ELECTRÓNICO</text>
    <rect x="30" y="160" width="300" height="42" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="45" y="186" font-family="sans-serif" font-size="13" fill="#0F172A">william@empresa.com</text>

    <!-- Contraseña -->
    <text x="35" y="227" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">CONTRASEÑA</text>
    <rect x="30" y="235" width="300" height="42" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="45" y="262" font-family="sans-serif" font-size="16" fill="#64748b">••••••••••••</text>

    <!-- Enlace ¿Olvidaste tu contraseña? -->
    <text x="325" y="296" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563EB">¿Olvidaste tu contraseña?</text>

    <!-- Botón de Ingreso -->
    <rect x="30" y="325" width="300" height="45" rx="14" fill="url(#degradadoBoton)" />
    <text x="180" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Ingresar al Sistema</text>

    <!-- Separador -->
    <line x1="30" y1="395" x2="330" y2="395" stroke="#E2E8F0" stroke-width="1" />

    <!-- Alerta de Contraseña Fallida -->
    <rect x="30" y="415" width="300" height="52" rx="12" fill="url(#degradadoAlerta)" stroke="#FECACA" stroke-width="1" />
    <circle cx="50" cy="441" r="8" fill="#EF4444" />
    <text x="50" y="445" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">!</text>
    <text x="68" y="437" font-family="sans-serif" font-size="11" font-weight="700" fill="#991B1B">Clave incorrecta</text>
    <text x="68" y="452" font-family="sans-serif" font-size="10" fill="#B91C1C">Haz clic en el enlace azul para recuperar</text>
  </g>

  <!-- ================= VISTA 2: RECUPERACIÓN (TELÉFONO ENMASCARADO) ================= -->
  <g transform="translate(460, 130)" filter="url(#sombraSuave)">
    <!-- Contenedor Tarjeta -->
    <rect width="360" height="500" rx="24" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Logo e Identidad (Centered horizontal corporate logo inside card) -->
    <g transform="translate(180, 20)">
      <rect x="-65" y="0" width="30" height="30" rx="7" fill="#2563eb" />
      <path d="M-54,7 L-54,23 L-49,23 C-44,23 -41,20 -41,15 C-41,10 -44,7 -49,7 Z" fill="#ffffff" />
      <path d="M-51,11 L-51,19 L-48,19 C-46,19 -44,18 -44,15 C-44,12 -46,11 -48,11 Z" fill="#2563eb" />
      <text x="-25" y="18" font-family="sans-serif" font-weight="900" font-size="16" fill="#0f172a" letter-spacing="0.5">DATTA <tspan fill="#2563eb" font-weight="500">ERP</tspan></text>
      <text x="-25" y="27" font-family="sans-serif" font-weight="700" font-size="6" fill="#94a3b8" letter-spacing="1">SOCIOS DE TU CRECIMIENTO</text>
    </g>
    
    <text x="180" y="90" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A">Verifica tu Identidad</text>
    <text x="180" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#64748B">Por seguridad, confirma tu número</text>

    <!-- Indicador de Teléfono Enmascarado -->
    <rect x="30" y="135" width="300" height="70" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <text x="180" y="158" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#B45309" letter-spacing="0.5">TELÉFONO ASOCIADO DETECTADO</text>
    <text x="180" y="188" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#78350F" letter-spacing="4">******53</text>

    <!-- Campo de Entrada (Input Teléfono Completo) -->
    <text x="35" y="237" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">INGRESA TU NÚMERO COMPLETO</text>
    <rect x="30" y="245" width="300" height="42" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5" />
    <text x="45" y="271" font-family="sans-serif" font-size="14" font-weight="500" fill="#0F172A">5512345653</text>
    <!-- Cursor parpadeante -->
    <line x1="130" y1="257" x2="130" y2="275" stroke="#2563EB" stroke-width="2" />

    <!-- Botón Enviar OTP -->
    <rect x="30" y="315" width="300" height="45" rx="14" fill="url(#degradadoBoton)" />
    <text x="180" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Enviar Código OTP</text>

    <!-- Instrucciones de Ayuda -->
    <rect x="30" y="380" width="300" height="95" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="45" y="402" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">¿Qué pasará a continuación?</text>
    <text x="45" y="422" font-family="sans-serif" font-size="10.5" fill="#64748B">• Validaremos el número contra el registro.</text>
    <text x="45" y="438" font-family="sans-serif" font-size="10.5" fill="#64748B">• Recibirás un OTP de 6 dígitos en tu email.</text>
    <text x="45" y="454" font-family="sans-serif" font-size="10.5" fill="#64748B">• Podrás restablecer tu llave de acceso.</text>
  </g>

  <!-- ================= VISTA 3: CAMBIO OBLIGATORIO (PRIMER INGRESO) ================= -->
  <g transform="translate(860, 130)" filter="url(#sombraSuave)">
    <!-- Contenedor Tarjeta -->
    <rect width="360" height="500" rx="24" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Logo e Identidad (Centered horizontal corporate logo inside card) -->
    <g transform="translate(180, 20)">
      <rect x="-65" y="0" width="30" height="30" rx="7" fill="#2563eb" />
      <path d="M-54,7 L-54,23 L-49,23 C-44,23 -41,20 -41,15 C-41,10 -44,7 -49,7 Z" fill="#ffffff" />
      <path d="M-51,11 L-51,19 L-48,19 C-46,19 -44,18 -44,15 C-44,12 -46,11 -48,11 Z" fill="#2563eb" />
      <text x="-25" y="18" font-family="sans-serif" font-weight="900" font-size="16" fill="#0f172a" letter-spacing="0.5">DATTA <tspan fill="#2563eb" font-weight="500">ERP</tspan></text>
      <text x="-25" y="27" font-family="sans-serif" font-weight="700" font-size="6" fill="#94a3b8" letter-spacing="1">SOCIOS DE TU CRECIMIENTO</text>
    </g>
    
    <text x="180" y="90" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0F172A">Actualiza tu Contraseña</text>
    <text x="180" y="110" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#64748B">Tu clave actual es genérica. Crea una nueva.</text>

    <!-- Indicador Informativo -->
    <rect x="30" y="132" width="300" height="42" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="180" y="157" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#065F46">🔒 PRIMER INICIO DETECTADO</text>

    <!-- Inputs -->
    <!-- Nueva Contraseña -->
    <text x="35" y="197" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">NUEVA CONTRASEÑA</text>
    <rect x="30" y="205" width="300" height="38" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="45" y="229" font-family="sans-serif" font-size="14" fill="#0F172A">••••••••••••</text>

    <!-- Confirmar Contraseña -->
    <text x="35" y="262" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">CONFIRMAR NUEVA CONTRASEÑA</text>
    <rect x="30" y="270" width="300" height="38" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="45" y="294" font-family="sans-serif" font-size="14" fill="#0F172A">••••••••••••</text>

    <!-- Barra de Fuerza de Contraseña (Feedback UX) -->
    <rect x="30" y="322" width="300" height="6" rx="3" fill="#E2E8F0" />
    <rect x="30" y="322" width="220" height="6" rx="3" fill="#10B981" />
    <text x="30" y="342" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#059669">Fuerza: Segura</text>

    <!-- Botón Guardar y Acceder -->
    <rect x="30" y="365" width="300" height="45" rx="14" fill="url(#degradadoBoton)" />
    <text x="180" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Guardar y Acceder al Home</text>

    <!-- Requisitos -->
    <text x="35" y="432" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748B">La contraseña debe tener mínimo:</text>
    <text x="35" y="449" font-family="sans-serif" font-size="9.5" fill="#475569">✔️ 8 caracteres, 1 número y 1 símbolo especial</text>
  </g>

  <!-- Indicadores de Conexión de Flujo (Flechas de Guía) -->
  <!-- Flecha 1 a 2 -->
  <path d="M 430 330 L 450 330" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4" />
  <!-- Flecha 1 a 3 (Si actualizar_contraseña = 1) -->
  <path d="M 390 190 L 420 190 L 420 110 L 880 110 L 880 120" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4" />
</svg>
