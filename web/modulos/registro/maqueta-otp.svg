<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="btnG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="modalShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ── PAGE BACKGROUND (blurred simulated form) ── -->
  <rect width="1280" height="720" fill="#F1F5F9"/>
  <rect width="1280" height="720" fill="rgba(15,23,42,0.6)"/>

  <!-- Centered Modal container -->
  <g transform="translate(423, 148)">
    <!-- Modal Card -->
    <rect width="434" height="420" rx="16" fill="white" filter="url(#modalShadow)"/>

    <!-- top accent bar -->
    <rect width="434" height="5" rx="3" fill="url(#btnG)"/>

    <!-- Email icon -->
    <circle cx="217" cy="44" r="26" fill="#EFF6FF"/>
    <rect x="201" y="35" width="32" height="22" rx="4" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <polyline points="201,35 217,49 233,35" fill="none" stroke="#3B82F6" stroke-width="2"/>

    <!-- Modal title -->
    <text x="217" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Verifica tu correo</text>
    <text x="217" y="112" text-anchor="middle" font-size="11" fill="#64748B">Ingresa el código de 6 dígitos enviado a</text>
    <text x="217" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#2563EB">william@empresa.com</text>

    <!-- Timer pill -->
    <rect x="157" y="140" width="120" height="22" rx="11" fill="#FEF3C7"/>
    <text x="217" y="155" text-anchor="middle" font-size="10" font-weight="600" fill="#D97706">⏱  Expira en 14:23</text>

    <!-- OTP Input Boxes (centered) -->
    <g transform="translate(41, 178)">
      <!-- Box 1 -->
      <rect width="52" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
      <text x="26" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1E293B">4</text>
      <!-- Box 2 -->
      <rect x="60" width="52" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
      <text x="86" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1E293B">8</text>
      <!-- Box 3 -->
      <rect x="120" width="52" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
      <text x="146" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1E293B">2</text>
      <!-- Box 4 -->
      <rect x="180" width="52" height="60" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="3"/>
      <rect x="205" y="22" width="2" height="20" rx="1" fill="#2563EB"/>
      <!-- Box 5 -->
      <rect x="240" width="52" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <!-- Box 6 -->
      <rect x="300" width="52" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    </g>

    <!-- Resend link -->
    <text x="217" y="264" text-anchor="middle" font-size="11" fill="#64748B">¿No recibiste el código? <tspan fill="#2563EB" font-weight="600">Reenviar</tspan></text>

    <!-- Verify button -->
    <rect x="41" y="280" width="352" height="44" rx="10" fill="#E2E8F0"/>
    <text x="217" y="307" text-anchor="middle" font-size="13" font-weight="600" fill="#94A3B8">Verificar código</text>

    <!-- Success preview -->
    <rect x="41" y="336" width="352" height="46" rx="10" fill="#F0FDF4" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="217" y="356" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">✅  ¡Registro completado!</text>
    <text x="217" y="372" text-anchor="middle" font-size="9" fill="#047857">Credenciales enviadas → redirigiendo...</text>

    <!-- Dismiss X -->
    <circle cx="414" cy="20" r="12" fill="#F1F5F9"/>
    <text x="414" y="25" text-anchor="middle" font-size="12" fill="#94A3B8">✕</text>
  </g>

  <!-- Label -->
  <rect x="345" y="692" width="590" height="22" rx="6" fill="#1E3A8A"/>
  <text x="640" y="707" text-anchor="middle" font-size="10" font-weight="600" fill="white">VERIFICACIÓN OTP — PASO 2</text>
</svg>
