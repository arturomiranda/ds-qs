<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />

  <!-- Panel Izquierdo (Branding) -->
  <rect width="540" height="720" fill="url(#leftPanel)" />
  <text x="50" y="80" font-family="sans-serif" font-weight="bold" font-size="28" fill="#fff">🚀 Datta ERP</text>
  <text x="50" y="250" font-family="sans-serif" font-weight="bold" font-size="48" fill="#fff">Gestión empresarial</text>
  <text x="50" y="310" font-family="sans-serif" font-weight="bold" font-size="48" fill="#fff">inteligente</text>
  
  <!-- Panel Derecho (Processing) -->
  <g transform="translate(680, 150)">
    <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="32" fill="#18181b">Configurando tu entorno</text>
    <text x="0" y="30" font-family="sans-serif" font-size="16" fill="#71717a">Estamos preparando tu infraestructura dedicada.</text>

    <rect y="70" width="480" height="350" rx="24" fill="#ffffff" filter="url(#shadow)" stroke="#e4e4e7" />
    
    <g transform="translate(240, 160)">
      <!-- Spinner rings -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#f4f4f5" stroke-width="8" />
      <path d="M 0 -50 A 50 50 0 0 1 50 0" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />
      <text x="0" y="10" font-family="sans-serif" font-size="32" text-anchor="middle">🚀</text>

      <text x="0" y="90" font-family="sans-serif" font-weight="bold" font-size="20" fill="#18181b" text-anchor="middle">Lanzando tu entorno</text>
      <text x="0" y="120" font-family="sans-serif" font-size="14" fill="#71717a" text-anchor="middle">Esto solo tomará un momento. Estamos preparando</text>
      <text x="0" y="140" font-family="sans-serif" font-size="14" fill="#71717a" text-anchor="middle">tu base de datos y recursos en la nube.</text>

      <!-- Progress bar -->
      <rect x="-100" y="170" width="200" height="6" rx="3" fill="#f4f4f5" />
      <rect x="-100" y="170" width="120" height="6" rx="3" fill="#2563eb" />
      
      <text x="0" y="200" font-family="sans-serif" font-weight="bold" font-size="12" fill="#10b981" letter-spacing="1" text-anchor="middle">✅ EN COLA DE DESPLIEGUE</text>
    </g>
  </g>
</svg>
