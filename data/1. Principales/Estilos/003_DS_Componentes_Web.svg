<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#f8fafc">COMPONENTES WEB (SPA)</text>
  
  <g transform="translate(50, 80)">
    <rect width="700" height="280" fill="#1e293b" rx="8" filter="url(#shadow)"/>
    
    <text x="40" y="40" font-weight="bold" fill="#f8fafc">Tarjetas de Grupo</text>
    <rect x="40" y="60" width="250" height="80" fill="#121929" stroke="#334155" stroke-width="1" rx="6"/>
    <text x="60" y="90" font-weight="bold" fill="#CBCCC4">Administradores</text>
    <text x="60" y="115" font-size="12" fill="#94a3b8">Acceso total al sistema</text>

    <text x="40" y="180" font-weight="bold" fill="#f8fafc">Badges CRUD</text>
    <rect x="40" y="200" width="30" height="30" fill="#14532d" rx="4"/>
    <text x="55" y="220" text-anchor="middle" font-weight="bold" fill="#4ade80">C</text>
    
    <rect x="80" y="200" width="30" height="30" fill="#1e3a8a" rx="4"/>
    <text x="95" y="220" text-anchor="middle" font-weight="bold" fill="#93c5fd">R</text>

    <rect x="120" y="200" width="30" height="30" fill="#78350f" rx="4"/>
    <text x="135" y="220" text-anchor="middle" font-weight="bold" fill="#fcd34d">U</text>

    <rect x="160" y="200" width="30" height="30" fill="#7f1d1d" rx="4"/>
    <text x="175" y="220" text-anchor="middle" font-weight="bold" fill="#fca5a5">D</text>
  </g>
</svg>
