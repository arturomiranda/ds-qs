<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- Actual Datta ERP background gradient matching bg-gradient-to-br from-blue-950 to-slate-950 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Real glowing blobs representing sky-500/10 and blue-500/10 in the app layout -->
    <radialGradient id="glowSky" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Professional card shadow filter matching shadow-2xl shadow-black/45 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Modern Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#glowSky)" />
  <rect width="1280" height="720" fill="url(#glowBlue)" />

  <!-- Clean Grid Lines representing abstract technology branding -->
  <path d="M0,80 L1280,80 M0,160 L1280,160 M0,240 L1280,240 M0,320 L1280,320 M0,400 L1280,400 M0,480 L1280,480 M0,560 L1280,560 M0,640 L1280,640" stroke="#ffffff" stroke-opacity="0.01" stroke-width="1" />
  <path d="M160,0 L160,720 M320,0 L320,720 M480,0 L480,720 M640,0 L640,720 M800,0 L800,720 M960,0 L960,720 M1120,0 L1120,720" stroke="#ffffff" stroke-opacity="0.01" stroke-width="1" />

  <!-- CENTERED OTP VERIFICATION CARD -->
  <!-- Card Base - Rx 40 representing rounded-[2.5rem] in React -->
  <rect x="370" y="100" width="540" height="520" rx="40" fill="#ffffff" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1" />

  <!-- Logo Section (Centered horizontal corporate logo) -->
  <g transform="translate(640, 130)">
    <!-- Stylized brand logo mark (Dattasoft D icon) -->
    <rect x="-100" y="5" width="40" height="40" rx="10" fill="#2563eb" />
    <path d="M-85,15 L-85,35 L-78,35 C-72,35 -68,31 -68,25 C-68,19 -72,15 -78,15 Z" fill="#ffffff" />
    <path d="M-81,20 L-81,30 L-77,30 C-74,30 -72,28 -72,25 C-72,22 -74,20 -77,20 Z" fill="#2563eb" />
    <!-- Brand Typography -->
    <text x="-50" y="28" font-family="sans-serif" font-weight="900" font-size="22" fill="#0f172a" letter-spacing="1">DATTA <tspan fill="#2563eb" font-weight="500">ERP</tspan></text>
    <text x="-50" y="42" font-family="sans-serif" font-weight="700" font-size="8" fill="#94a3b8" letter-spacing="2">SOCIOS DE TU CRECIMIENTO</text>
  </g>

  <!-- Content Group -->
  <g transform="translate(410, 205)">
    <!-- Mail Icon Bubble -->
    <circle cx="230" cy="40" r="32" fill="#eff6ff" />
    <!-- Envelope vector icon instead of emoji for ultra-premium look -->
    <rect x="219" y="32" width="22" height="16" rx="2" fill="none" stroke="#2563eb" stroke-width="2" />
    <path d="M219,34 L230,41 L241,34" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" />

    <!-- Text headers -->
    <text x="230" y="98" font-family="sans-serif" font-weight="bold" font-size="22" fill="#0f172a" text-anchor="middle">Verifica tu correo</text>
    <text x="230" y="118" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Código enviado a <tspan fill="#0f172a" font-weight="bold">juan@empresa.com</tspan></text>

    <!-- OTP Input Box -->
    <g transform="translate(0, 145)">
      <text x="230" y="12" font-family="sans-serif" font-weight="bold" font-size="10" fill="#94a3b8" letter-spacing="1.5" text-anchor="middle">CÓDIGO DE VERIFICACIÓN</text>
      <rect x="0" y="24" width="460" height="58" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
      <text x="230" y="62" font-family="monospace" font-weight="bold" font-size="30" fill="#0f172a" letter-spacing="15" text-anchor="middle">482917</text>
    </g>

    <!-- Confirm button -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="460" height="50" rx="16" fill="#2563eb" />
      <text x="230" y="30" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">Confirmar Registro</text>
    </g>

    <!-- Countdown & Back Options -->
    <g transform="translate(0, 325)">
      <!-- Animated status symbol and cooldown -->
      <circle cx="120" cy="10" r="4" fill="#3b82f6" opacity="0.8" />
      <text x="132" y="14" font-family="sans-serif" font-weight="bold" font-size="12" fill="#2563eb">Reenviar código en 2:45</text>

      <!-- Back button -->
      <path d="M225,48 L218,53 L225,58" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="219" y1="53" x2="231" y2="53" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
      <text x="238" y="57" font-family="sans-serif" font-size="13" fill="#64748b">Volver al registro</text>
    </g>
  </g>
</svg>
